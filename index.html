<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blood Axe: Oath of Vengeance</title>
  <!-- Fonts (src/view/fonts.js). Offline, the game falls back to Georgia. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cormorant+Garamond:wght@600;700&display=block">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #game { width: 100%; height: 100%; }
    #error { color: #e0c0a0; font: 16px sans-serif; padding: 40px; display: none; }
    #studio-intro { position: fixed; inset: 0; z-index: 100; background: #000; }
    #studio-intro video { display: block; width: 100%; height: 100%; object-fit: contain; }
    .intro-controls { position: absolute; right: max(20px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px; }
    .intro-controls button { border: 1px solid #54e9ff; border-radius: 4px; background: rgba(0, 0, 0, .88); color: #e8fcff; padding: 10px 16px; font: 15px system-ui, sans-serif; cursor: pointer; }
    .intro-controls button:focus-visible { outline: 3px solid #ffad52; outline-offset: 4px; }
    .intro-controls button:hover { background: #10343c; }
    #intro-status { position: absolute; left: 20px; bottom: 20px; max-width: 50%; color: #d5f9ff; font: 14px system-ui, sans-serif; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="error"></div>
  <section id="studio-intro" aria-label="UFO Technologies logo and opening cinematic">
    <video id="intro-video" src="assets/video/ufo-technologies-intro.mp4" preload="auto" playsinline aria-hidden="true"></video>
    <video id="cinematic-video" src="assets/video/opening-cinematic.mp4" preload="auto" playsinline muted hidden aria-hidden="true"></video>
    <p id="intro-status" role="status" aria-live="polite"></p>
    <div class="intro-controls">
      <button id="intro-sound" type="button" hidden>Play with sound</button>
      <button id="intro-skip" type="button" aria-label="Skip (Escape or controller B)">Skip · Esc</button>
    </div>
  </section>

  <!-- When this copy of the game was built (tools/build-release.ps1 stamps it; 0 = not a
       release). Online, two players' games compare it to say who needs to refresh. -->
  <script>window.BUILD_TIME = 0;</script>

  <!-- Phaser 3: uses the local copy in lib/ (downloaded by the start script);
       falls back to the online copy if it's missing. -->
  <script src="lib/phaser.min.js"></script>
  <script>
    if (!window.Phaser) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"><\/script>');
    }
  </script>
  <script>
    if (!window.Phaser) {
      var e = document.getElementById('error');
      e.style.display = 'block';
      e.textContent = 'Could not load Phaser. Connect to the internet once and restart with start-game.bat.';
    }
  </script>

  <!-- The game itself (ES modules) -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
