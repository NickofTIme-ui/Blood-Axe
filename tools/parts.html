<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parts Sheet Cutter</title>
<style>
  :root { --bg: #1a1414; --fg: #e8d8c0; --muted: #9a8a78; --accent: #e0a030; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 4px 0 12px; max-width: 70ch; }
  input { background: #2a2020; color: var(--fg); border: 1px solid #4a3a3a; padding: 6px 8px; width: min(420px, 100%); }
  button { background: var(--accent); border: 0; padding: 7px 12px; font-weight: 600; cursor: pointer; }
  .wrap { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
  canvas { max-width: 100%; background: repeating-conic-gradient(#333 0 25%, #444 0 50%) 0 0 / 16px 16px; }
  pre { background: #0e0a0a; padding: 12px; overflow: auto; max-width: 100%; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Parts sheet cutter</h1>
<p>Loads a parts sheet, keys out the background and finds each separate part.
Copy the output into <code>src/data/enemyParts.js</code>, rename each part, and fix pivots if needed.</p>
<input id="file" value="assets/enemies/butcher-parts.png">
<button id="go">Find parts</button>
<div class="wrap"><canvas id="c"></canvas><pre id="out"></pre></div>
<script>
const $ = (id) => document.getElementById(id);
const qs = new URLSearchParams(location.search);
if (qs.get('file')) $('file').value = qs.get('file');

// Default pivot guesses from a part's box: top-centre for hanging limbs,
// bottom-centre for heads / torsos / weapons.
function guess(b) {
  const cx = Math.round(b.x + b.w / 2);
  const tall = b.h > b.w * 1.8;
  return tall
    ? { pivot: [cx, b.y + Math.round(b.w * 0.35)], end: [cx, b.y + b.h - Math.round(b.w * 0.35)] }
    : { pivot: [cx, b.y + b.h - 2] };
}

async function run() {
  const img = new Image();
  img.src = '/' + $('file').value.replace(/^\//, '') + '?' + Date.now();
  await img.decode();
  const W = img.width, H = img.height;
  const c = $('c'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, W, H);
  const d = data.data;
  // background = most common border colour
  const counts = new Map();
  for (let x = 0; x < W; x += 4) for (const y of [0, H - 1]) {
    const i = (y * W + x) * 4; const k = [d[i] >> 4, d[i + 1] >> 4, d[i + 2] >> 4].join();
    counts.set(k, (counts.get(k) || 0) + 1);
  }
  const top = [...counts].sort((a, b) => b[1] - a[1])[0][0].split(',').map((v) => v * 16 + 8);
  const tol = 110;
  const solid = new Uint8Array(W * H);
  for (let p = 0; p < W * H; p++) {
    const i = p * 4;
    solid[p] = Math.hypot(d[i] - top[0], d[i + 1] - top[1], d[i + 2] - top[2]) >= tol ? 1 : 0;
    if (!solid[p]) d[i + 3] = 0;
  }
  ctx.putImageData(data, 0, 0);
  // connected components (8-way), on a slightly dilated mask so thin chains stay together
  const label = new Int32Array(W * H);
  const boxes = [];
  for (let p = 0; p < W * H; p++) {
    if (!solid[p] || label[p]) continue;
    const id = boxes.length + 1;
    let x0 = W, y0 = H, x1 = 0, y1 = 0, n = 0;
    const stack = [p]; label[p] = id;
    while (stack.length) {
      const q = stack.pop(); const x = q % W; const y = (q / W) | 0; n++;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const r = ny * W + nx;
        if (solid[r] && !label[r]) { label[r] = id; stack.push(r); }
      }
    }
    boxes.push({ x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1, n });
  }
  const parts = boxes.filter((b) => b.n > 400).sort((a, b) => (Math.abs(a.y - b.y) > 80 ? a.y - b.y : a.x - b.x));
  ctx.lineWidth = 3; ctx.font = 'bold 28px sans-serif';
  const lines = [];
  parts.forEach((b, i) => {
    ctx.strokeStyle = '#00ff66'; ctx.strokeRect(b.x - 2, b.y - 2, b.w + 4, b.h + 4);
    ctx.fillStyle = '#00ff66'; ctx.fillText(String(i + 1), b.x, b.y - 6);
    const g = guess(b);
    ctx.fillStyle = '#ff2a2a'; ctx.fillRect(g.pivot[0] - 5, g.pivot[1] - 5, 10, 10);
    if (g.end) { ctx.fillStyle = '#2a8aff'; ctx.fillRect(g.end[0] - 5, g.end[1] - 5, 10, 10); }
    lines.push(`    part${i + 1}: { rect: [${b.x}, ${b.y}, ${b.w}, ${b.h}], pivot: [${g.pivot}]${g.end ? `, end: [${g.end}]` : ''} },`);
  });
  $('out').textContent = `bg: [${top}],  // ${W}x${H}, ${parts.length} parts\nparts: {\n${lines.join('\n')}\n},`;
  window.found = { bg: top, parts, W, H };
}
$('go').onclick = run;
if (qs.get('file')) run();
</script>
</body>
</html>
